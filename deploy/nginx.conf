# 公网入口。只转发短链跳转和管理 API。
# /metrics、/healthz 和 /readyz 留在进程自己的运维端口上（OPS_ADDR），内网 Prometheus 和探活直接访问，不经过这里。
#
# X-Forwarded-For 覆盖成 $remote_addr，不用 $proxy_add_x_forwarded_for。
# 追加会把客户端自己带来的地址留在左边。应用在 trusted_proxies: ["*"]（或 TRUSTED_PROXIES=*）下取最右一段；
# 覆盖之后只有一段，和最右一段是同一个地址。若前置了 CDN/云 LB，请在应用端配置可信代理 CIDR 列表。
#
# 上游端口是本机默认值。改了 ADDR / CONSOLE_ADDR 时，这里要一起改。
# 容器里用 host.docker.internal 访问宿主机上的进程；本机直接跑 nginx 时改成 127.0.0.1。

limit_req_zone $binary_remote_addr zone=redirect_ip:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_ip:10m rate=10r/s;

upstream redirector {
    server host.docker.internal:8080;
}

upstream console {
    server host.docker.internal:8081;
}

server {
    listen 80;
    server_name _;
    limit_req_status 429;

    # 生产环境应终止 TLS（例如监听 443 ssl，并把 80 301 重定向到 HTTPS）：
    # listen 443 ssl http2;
    # ssl_certificate     /etc/ssl/certs/shortlink.crt;
    # ssl_certificate_key /etc/ssl/private/shortlink.key;

    location /r/ {
        limit_req zone=redirect_ip burst=60 nodelay;
        proxy_pass http://redirector;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/ {
        limit_req zone=api_ip burst=20 nodelay;
        proxy_pass http://console;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # 若 console 已启用 console.web_dist_dir: web/dist 托管前端控制台，必须显式封禁运维端点后才可把 / 代理到 console：
    #   location = /metrics { deny all; }
    #   location = /healthz { deny all; }
    #   location = /readyz  { deny all; }
    #   location / {
    #       proxy_pass http://console;
    #       proxy_set_header Host $host;
    #       proxy_set_header X-Forwarded-For $remote_addr;
    #   }
    location / {
        return 404;
    }
}
