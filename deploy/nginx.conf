# 公网入口。只转发短链跳转和管理 API。
# /metrics、/healthz 和 /readyz 留在进程自己的端口上，内网 Prometheus 和探活直接访问，不经过这里。
#
# X-Forwarded-For 覆盖成 $remote_addr，不用 $proxy_add_x_forwarded_for。
# 追加会把客户端自己带来的地址留在左边。应用在 TRUST_PROXY_HEADERS 下取最右一段；
# 覆盖之后只有一段，和最右一段是同一个地址。
#
# 上游端口是本机默认值。改了 ADDR / CONSOLE_ADDR 时，这里要一起改。
# 容器里用 host.docker.internal 访问宿主机上的进程；本机直接跑 nginx 时改成 127.0.0.1。

upstream redirector {
    server host.docker.internal:8080;
}

upstream console {
    server host.docker.internal:8081;
}

server {
    listen 80;
    server_name _;

    location /r/ {
        proxy_pass http://redirector;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/ {
        proxy_pass http://console;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        return 404;
    }
}
