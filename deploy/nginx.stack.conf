# 应用栈里的公网入口。上游是 compose 网络里的进程，不是宿主机端口。
# 宿主机上直接跑的进程仍用 deploy/nginx.conf。
#
# 只转发 /r/ 和 /api/。/metrics、/healthz、/readyz 留在各自独立运维端口上（OPS_ADDR），
# 探活和 Prometheus 直连，不经过这里。
#
# X-Forwarded-For 覆盖成 $remote_addr。应用开了 TRUST_PROXY_HEADERS 时取最右一段；
# 覆盖之后只有一段，和最右一段是同一个地址。

limit_req_zone $binary_remote_addr zone=redirect_ip:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_ip:10m rate=10r/s;

upstream redirector {
    server redirector:8080;
}

upstream console {
    server console:8081;
}

server {
    listen 80;
    server_name _;
    limit_req_status 429;

    location /r/ {
        limit_req zone=redirect_ip burst=60 nodelay;
        proxy_pass http://redirector;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/ {
        limit_req zone=api_ip burst=20 nodelay;
        proxy_pass http://console;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # 若 console 已启用 WEB_DIST_DIR 托管前端控制台，需显式 deny /metrics、/healthz、/readyz 后再代理 / 到 console。
    location / {
        return 404;
    }
}
