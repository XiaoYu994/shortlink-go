# 本地开发用。Prometheus 在容器里抓宿主机上 make run-* 起的两个进程。
# 两个进程的指标名相同，用 job 区分；查询时按 job 过滤。
global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: redirector
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: console
    static_configs:
      - targets:
          - host.docker.internal:8081
