# 默认端口下的抓取配置，给人看。
# make prometheus 和 make up 会按 ADDR、CONSOLE_ADDR 生成
# deploy/prometheus.local.yml。容器挂的是整个 deploy 目录，读这一份。
# 两个进程的指标名相同，用 job 区分；查询时按 job 过滤。
global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: redirector
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: console
    static_configs:
      - targets:
          - host.docker.internal:8081
