# 本地开发用的依赖。账号密码仅用于本机开发。
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shortlink
      POSTGRES_PASSWORD: shortlink
      POSTGRES_DB: shortlink
    ports:
      - "127.0.0.1:5432:5432"
    # 表结构不在容器第一次启动时执行。数据卷起来之后，在仓库根目录 make migrate。
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortlink -d shortlink"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 可选的公网入口。默认不启动；需要时：docker compose --profile edge up -d nginx
  # 只暴露 /r/ 和 /api/。/metrics 仍由 Prometheus 直接抓宿主机上的进程端口。
  nginx:
    image: nginx:1.27-alpine
    profiles: ["edge"]
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 可选的应用栈。默认不启动，make up / deps-up 也不会带上它。
  # 启动：docker compose --profile app up -d --build
  # 公网入口是 127.0.0.1:28088，只转发 /r/ 和 /api/。
  # 进程端口绑在 127.0.0.1:28080 和 28081，给探活和 Prometheus，避开本机的 8080/8081。
  # 不要和 make run-* 同时打这一份 Redis：缓存 key 会混在一起。
  # 连接串写死在 compose 网络里，不读宿主机的 .env，避免连到开发库。
  # VISITOR_SALT 是开发占位值，生产和密钥管理注入的值不是这一个。
  migrate:
    profiles: ["app"]
    image: shortlink:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: postgres://shortlink:shortlink@postgres:5432/shortlink?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redirector:
    profiles: ["app"]
    image: shortlink:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["redirector"]
    environment:
      ADDR: ":8080"
      DATABASE_URL: postgres://shortlink:shortlink@postgres:5432/shortlink?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      VISITOR_SALT: dev-only-visitor-salt
      TRUST_PROXY_HEADERS: "true"
      LOG_FORMAT: json
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:28080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # 默认 DRAIN_DELAY 是 5s，和下面的 interval 一样。宽限要盖住摘流、
    # SHUTDOWN_TIMEOUT，以及 redirector 再排空点击的一份 SHUTDOWN_TIMEOUT
    # 和在途批次写入（2s）。更短的话，容器会在 Shutdown 完成前收到 SIGKILL。
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  console:
    profiles: ["app"]
    image: shortlink:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["console", "serve"]
    environment:
      CONSOLE_ADDR: ":8081"
      DATABASE_URL: postgres://shortlink:shortlink@postgres:5432/shortlink?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      LOG_FORMAT: json
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:28081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # 和 redirector 同一份宽限：DRAIN_DELAY 加 SHUTDOWN_TIMEOUT，留出余量。
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  gateway:
    profiles: ["app"]
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:28088:80"
    volumes:
      - ./deploy/nginx.stack.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      redirector:
        condition: service_healthy
      console:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    # Docker Desktop 在 WSL 里绑定单个文件会报 mount 源不存在。
    # 挂目录，配置文件用 make 生成的 prometheus.local.yml。
    command:
      - --config.file=/etc/prometheus/prometheus.local.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy:/etc/prometheus:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
