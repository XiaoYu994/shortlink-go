# 本地开发用的依赖。账号密码仅用于本机开发。
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shortlink
      POSTGRES_PASSWORD: shortlink
      POSTGRES_DB: shortlink
    ports:
      - "127.0.0.1:5432:5432"
    # 表结构不在容器第一次启动时执行。数据卷起来之后，在仓库根目录 make migrate。
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortlink -d shortlink"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 可选的公网入口。默认不启动；需要时：docker compose --profile edge up -d nginx
  # 只暴露 /r/ 和 /api/。/metrics 仍由 Prometheus 直接抓宿主机上的进程端口。
  nginx:
    image: nginx:1.27-alpine
    profiles: ["edge"]
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prometheus:
    image: prom/prometheus:v2.55.1
    # Docker Desktop 在 WSL 里绑定单个文件会报 mount 源不存在。
    # 挂目录，配置文件用 make 生成的 prometheus.local.yml。
    command:
      - --config.file=/etc/prometheus/prometheus.local.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy:/etc/prometheus:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
